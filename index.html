    <!-- Fonts: Space Grotesk carries the voice, JetBrains Mono the data. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Applies the saved theme before first paint, so a returning visitor on
      dark never sees a flash of the light palette.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('sb-portfolio-theme');
          var prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)'
          ).matches;
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : prefersDark
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          /* Storage unavailable — the default in the markup stands. */
        }
      })();
    </script>
